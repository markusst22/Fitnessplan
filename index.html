<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111214">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aufbau">
<title>Aufbau – Training & Ernährung</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%8F%8B%EF%B8%8F</text></svg>">
<style>
:root{
  --bg:#f7f7f8; --surface:#ffffff; --surface-2:#f0f0f2; --line:#e3e3e6;
  --text:#111214; --text-2:#6b6d73; --text-3:#9b9da3;
  --accent:#E8734A; --accent-soft:#fdf0ea;
  --push:#E8734A; --pull:#4A8FE8; --beine:#4AA36B;
  --ok:#3f9c62; --radius:16px; --radius-sm:10px;
  --sh:0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111214; --surface:#1a1b1e; --surface-2:#232428; --line:#2c2e33;
    --text:#f2f2f3; --text-2:#a0a2a8; --text-3:#6e7077;
    --accent:#F08356; --accent-soft:#2a1d17;
    --sh:0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  }
}
}
:root[data-theme="dark"]{
    --bg:#111214; --surface:#1a1b1e; --surface-2:#232428; --line:#2c2e33;
    --text:#f2f2f3; --text-2:#a0a2a8; --text-3:#6e7077;
    --accent:#F08356; --accent-soft:#2a1d17;
    --sh:0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.02em}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
input,select{font:inherit;color:inherit}

/* ---------- Header ---------- */
header{
  position:sticky;top:0;z-index:50;background:var(--bg);
  padding:calc(12px + env(safe-area-inset-top)) 20px 12px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  border-bottom:1px solid transparent;transition:border-color .2s;
}
header.scrolled{border-bottom-color:var(--line)}
header h1{font-size:23px}
.hsub{font-size:12.5px;color:var(--text-3);margin-top:1px;font-weight:450;letter-spacing:0}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:var(--sh)}
.icon-btn svg{width:19px;height:19px;stroke:var(--text-2);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Layout ---------- */
main{padding:4px 20px 24px;max-width:640px;margin:0 auto}
.view{display:none;animation:fade .22s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--sh);padding:18px;margin-bottom:14px}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.sec-title{font-size:12px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);margin:26px 0 10px}
.sec-title:first-child{margin-top:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.muted{color:var(--text-2);font-size:14px}
.tiny{color:var(--text-3);font-size:12.5px}

/* ---------- Bottom nav ---------- */
nav{
  background:var(--surface);
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:color-mix(in srgb, var(--surface) 96%, transparent);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(3,1fr);
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));
}
nav button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;color:var(--text-3);font-size:11px;font-weight:550;border-radius:12px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.active{color:var(--accent)}

/* ---------- Training ---------- */
.day-pill{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:99px;background:var(--surface-2);color:var(--text-2)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.hero{background:var(--surface);border-radius:var(--radius);box-shadow:var(--sh);padding:20px;margin-bottom:16px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--acc,var(--accent))}
.hero h2{font-size:26px;margin-bottom:2px}
.ex{background:var(--surface);border-radius:var(--radius);box-shadow:var(--sh);margin-bottom:12px;overflow:hidden}
.ex-head{padding:15px 18px;display:flex;align-items:flex-start;gap:12px;cursor:pointer}
.ex-num{flex:0 0 26px;height:26px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-size:12.5px;font-weight:650;color:var(--text-2);margin-top:1px}
.ex-title{font-weight:600;font-size:15.5px;line-height:1.35}
.ex-meta{font-size:12.5px;color:var(--text-3);margin-top:3px}
.chev{margin-left:auto;flex:0 0 auto;transition:transform .2s;color:var(--text-3);font-size:13px;margin-top:4px}
.ex.open .chev{transform:rotate(90deg)}
.ex-body{display:none;padding:0 18px 16px}
.ex.open .ex-body{display:block}
.note{background:var(--surface-2);border-radius:var(--radius-sm);padding:11px 13px;font-size:13.5px;color:var(--text-2);margin-bottom:14px}
.note b{color:var(--text);font-weight:600}
.sets{display:flex;flex-direction:column;gap:8px}
.set{display:grid;grid-template-columns:26px 1fr 1fr 40px;gap:8px;align-items:center}
.set-lbl{font-size:12.5px;color:var(--text-3);font-weight:600}
.fld{position:relative}
.fld input{width:100%;background:var(--surface-2);border:1.5px solid transparent;border-radius:var(--radius-sm);padding:10px 34px 10px 12px;font-size:15px;font-weight:550;text-align:left;outline:none;transition:border-color .15s}
.fld input:focus{border-color:var(--accent)}
.fld span{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--text-3);pointer-events:none}
.set-done{width:34px;height:34px;border-radius:50%;border:1.8px solid var(--line);display:grid;place-items:center;margin-left:auto;transition:all .15s}
.set-done.on{background:var(--ok);border-color:var(--ok)}
.set-done svg{width:15px;height:15px;stroke:var(--text-3);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.set-done.on svg{stroke:#fff}
.last{font-size:12px;color:var(--text-3);margin-top:9px}

.btn{display:block;width:100%;padding:15px;border-radius:14px;background:var(--accent);color:#fff;font-weight:650;font-size:15.5px;text-align:center;transition:transform .1s,opacity .15s}
.btn:active{transform:scale(.985)}
.btn.sec{background:var(--surface);color:var(--text);box-shadow:var(--sh)}
.btn.ghost{background:var(--surface-2);color:var(--text-2);font-size:14px;padding:12px}
.btn[disabled]{opacity:.45}
.btn-row{display:flex;gap:10px;margin-top:6px}
.btn-row .btn{margin:0}

/* ---------- Ernährung ---------- */
.days{display:flex;gap:7px;overflow-x:auto;padding:2px 0 12px;margin:0 -20px;padding-left:20px;padding-right:20px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day-btn{flex:0 0 auto;min-width:50px;padding:9px 6px;border-radius:13px;background:var(--surface);box-shadow:var(--sh);text-align:center;transition:all .15s}
.day-btn .d{font-size:11px;font-weight:600;color:var(--text-3);letter-spacing:.04em}
.day-btn .n{font-size:16px;font-weight:650;margin-top:1px}
.day-btn.active{background:var(--text);color:var(--bg)}
.day-btn.active .d{color:var(--bg);opacity:.6}
.day-btn .fish{font-size:9px;margin-top:2px;line-height:1}
.macros{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.macro{background:var(--surface);border-radius:var(--radius-sm);box-shadow:var(--sh);padding:11px 8px;text-align:center}
.macro .v{font-size:17px;font-weight:650;letter-spacing:-.02em}
.macro .l{font-size:10.5px;color:var(--text-3);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-top:1px}
.macro.hit .v{color:var(--ok)}
.meal{background:var(--surface);border-radius:var(--radius);box-shadow:var(--sh);margin-bottom:12px;overflow:hidden}
.meal-head{padding:15px 18px;display:flex;align-items:flex-start;gap:12px;cursor:pointer}
.meal-slot{font-size:10.5px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.meal h3{font-size:16px;margin-top:2px;line-height:1.3}
.badge{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--text-2);margin-left:6px;vertical-align:1px}
.meal-body{display:none;padding:0 18px 18px}
.meal.open .meal-body{display:block}
.ing{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.ing:last-child{border-bottom:none}
.ing .q{color:var(--text-2);white-space:nowrap;font-variant-numeric:tabular-nums}
ol.steps{margin:14px 0 0;padding-left:20px;font-size:14px;color:var(--text-2)}
ol.steps li{margin-bottom:7px}
.reroll{margin-left:auto;flex:0 0 auto;width:32px;height:32px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--text-3);font-size:14px}

/* ---------- Einkauf ---------- */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:6px}
.chip{padding:8px 13px;border-radius:99px;background:var(--surface);box-shadow:var(--sh);font-size:13.5px;font-weight:550;transition:all .15s}
.chip.on{background:var(--text);color:var(--bg)}
.shop-item{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.shop-item:last-child{border-bottom:none}
.cb{flex:0 0 auto;width:23px;height:23px;border-radius:7px;border:1.8px solid var(--line);display:grid;place-items:center;margin-top:1px;transition:all .15s}
.cb.on{background:var(--ok);border-color:var(--ok)}
.cb svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.cb.on svg{opacity:1}
.shop-item.done .si-name{text-decoration:line-through;color:var(--text-3)}
.si-name{font-size:14.5px;font-weight:500;line-height:1.35}
.si-q{font-size:12.5px;color:var(--text-3);margin-top:2px;font-variant-numeric:tabular-nums}
.si-pack{color:var(--accent);font-weight:600}

/* ---------- Modal ---------- */
.sheet{position:fixed;inset:0;z-index:100;display:none}
.sheet.open{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sheet-in{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:8px 20px calc(28px + env(safe-area-inset-bottom));animation:up .25s cubic-bezier(.3,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.grip{width:36px;height:4px;border-radius:99px;background:var(--line);margin:8px auto 16px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.opt:last-of-type{border-bottom:none}
.opt-l{font-size:14.5px;font-weight:550}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:7px 14px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--text-2)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.stepper{display:flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:10px;padding:3px}
.stepper button{width:32px;height:32px;border-radius:8px;font-size:17px;font-weight:600;color:var(--text-2);display:grid;place-items:center}
.stepper .val{min-width:66px;text-align:center;font-size:14px;font-weight:650;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:44px 20px;color:var(--text-3);font-size:14.5px}
.hist{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist:last-child{border-bottom:none}
</style>
</head>

  </button>
</header>

<main>

</main>

<nav>

</nav>

<div class="sheet" id="sheet">

"Schultern vor Push- und Pull-Tagen kreisen und mit leichten Face Pulls mobilisieren"]};
const Z = DATEN.zutaten, R = DATEN.rezepte, TR = DATEN.training;
const TAGE = ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
const TAGE_K = ["Mo","Di","Mi","Do","Fr","Sa","So"];

const SLOTS3 = ["Mahlzeit 1","Mahlzeit 2","Mahlzeit 3"];

/* ============ State ============ */
const DEF = {
  tab:"training", kcal:2800, proteinProKg:1.5, mahlzeiten:2,
  woche:null, wocheSeed:null, tagIdx:0,
  wIdx:0, wLog:{}, wAktiv:null, historie:[],
  einkaufTage:[0,1,2,3,4,5,6], abgehakt:{}
};
let S = load();

function load(){
  try{
    const raw = localStorage.getItem("aufbau_v1");
    if(raw) return Object.assign({}, DEF, JSON.parse(raw));
  }catch(e){ console.warn("localStorage nicht verfügbar – Daten werden nicht gespeichert.", e); }
  return JSON.parse(JSON.stringify(DEF));
}
function save(){
  try{ localStorage.setItem("aufbau_v1", JSON.stringify(S)); }catch(e){}
}
const proteinZiel = () => Math.round(KG * S.proteinProKg);

/* ============ Zufall (deterministisch pro Woche) ============ */
function rng(seed){
  let t = seed >>> 0;
  return function(){
    t += 0x6D2B79F5;
    let r = Math.imul(t ^ (t >>> 15), 1 | t);
    r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}
const pick = (arr, rnd) => arr[Math.floor(rnd() * arr.length)];
function shuffle(arr, rnd){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

/* ============ Wochenplan ============ */
const FRUEH = R.filter(r => r.typ === "fruehstueck");
const HAUPT = R.filter(r => r.typ === "haupt");
const SHAKE = R.filter(r => r.typ === "shake");
const HAUPT_FISCH = HAUPT.filter(r => r.fisch);
const HAUPT_OHNE  = HAUPT.filter(r => !r.fisch);
const FRUEH_FISCH = FRUEH.filter(r => r.fisch);
const FRUEH_OHNE  = FRUEH.filter(r => !r.fisch);

function planeWoche(seed){
  const rnd = rng(seed);
  const n = S.mahlzeiten;
  // genau 2 Fischtage, Shakes max. 3x/Woche und nie an zwei Tagen hintereinander
  const fischTage = shuffle([0,1,2,3,4,5,6], rnd).slice(0, DATEN.ziele.fischtage);
  let shakeTage = [];
  if(n === 3){
    const kand = shuffle([0,1,2,3,4,5,6], rnd);
    for(const t of kand){
      if(shakeTage.length >= DATEN.ziele.shakes_max) break;
      if(shakeTage.some(x => Math.abs(x - t) === 1)) continue;
      shakeTage.push(t);
    }
  }
  const benutztF = new Set(), benutztH = new Set(), benutztS = new Set();
  const frei = (liste, benutzt) => { const f = liste.filter(r => !benutzt.has(r.id)); return f.length ? f : liste; };

  const tage = [];
  for(let d = 0; d < 7; d++){
    const istFisch = fischTage.includes(d);
    const hatShake = shakeTage.includes(d);
    let best = null;
    for(let versuch = 0; versuch < 40; versuch++){
      const mahlzeiten = [];
      mahlzeiten.push(pick(frei(FRUEH_OHNE, benutztF), rnd));
      mahlzeiten.push(pick(frei(istFisch ? HAUPT_FISCH : HAUPT_OHNE, benutztH), rnd));
      if(n === 3){
        mahlzeiten.push(hatShake ? pick(frei(SHAKE, benutztS), rnd)
                                 : pick(frei(HAUPT_OHNE.filter(r => r.id !== mahlzeiten[1].id), benutztH), rnd));
      }
      const basis = mahlzeiten.reduce((s, m) => s + m.makro.kcal, 0);
      const f = S.kcal / basis;
      const prot = mahlzeiten.reduce((s, m) => s + m.makro.p, 0) * f;
      const score = Math.abs(f - (n === 2 ? 1.45 : 1.10)) + (prot < proteinZiel() ? 5 : 0);
      if(!best || score < best.score) best = { mahlzeiten, f, score };
      if(score < 0.08) break;
    }
    best.mahlzeiten.forEach(m => {
      if(m.typ === "fruehstueck") benutztF.add(m.id);
      else if(m.typ === "shake") benutztS.add(m.id);
      else benutztH.add(m.id);
    });
    const faktor = Math.min(2.0, Math.max(0.7, Math.round(best.f * 20) / 20));
    tage.push({ fisch: istFisch, faktor, ids: best.mahlzeiten.map(m => m.id) });
  }
  return { seed, mahlzeiten: n, kcal: S.kcal, tage };
}

function neueWoche(seed){
  S.wocheSeed = seed !== undefined ? seed : (Date.now() % 1000000);
  S.woche = planeWoche(S.wocheSeed);
  S.abgehakt = {};
  save();
}
function checkWoche(){
  if(!S.woche || S.woche.mahlzeiten !== S.mahlzeiten || S.woche.kcal !== S.kcal) neueWoche(S.wocheSeed ?? undefined);
}
const rez = id => R.find(r => r.id === id);
function tagMakros(t){
  const m = { kcal:0, p:0, f:0, kh:0 };
  t.ids.forEach(id => { const r = rez(id);
    m.kcal += r.makro.kcal * t.faktor; m.p += r.makro.p * t.faktor;
    m.f += r.makro.f * t.faktor; m.kh += r.makro.kh * t.faktor; });
  return m;
}
/* Mengen runden: Stückzutaten auf halbe Stück, alles andere auf 5 g */
function menge(key, gramm){
  const z = Z[key];
  if(z.vorrat) return { txt: "nach Geschmack", g: 0 };
  if(z.stueck && gramm / z.stueck >= 0.4){
    const st = Math.round(gramm / z.stueck * 2) / 2;
    const einh = st === 1 ? "Stück" : "Stück";
    return { txt: `${st.toString().replace(".",",")} ${einh}`, g: st * z.stueck };
  }
  const g = gramm < 20 ? Math.round(gramm) : Math.round(gramm / 5) * 5;
  return { txt: `${g} ${einheit(key)}`, g };
}
const einheit = key => /\d+\s*(ml|l\b)/i.test(Z[key].packname) ? "ml" : "g";

/* ============ Rendering: Training ============ */
function renderTraining(){
  const plan = TR[S.wIdx % 3];
  const naechste = TR[(S.wIdx + 1) % 3];
  const log = S.wAktiv && S.wAktiv.planId === plan.id ? S.wAktiv : null;
  const farbe = plan.id === "push" ? "var(--push)" : plan.id === "pull" ? "var(--pull)" : "var(--beine)";

  let h = `<div class="hero" style="--acc:${farbe}">

  plan.uebungen.forEach((u, i) => {

    h += `<div class="ex" id="ex-${u.id}">

      </div>
      <div class="ex-body">
        <div class="note"><b>${u.equip}</b><br>${u.hinweis}</div>
        <div class="sets">`;
    for(let s = 0; s < u.saetze; s++){
      const a = akt && akt[s] ? akt[s] : {};
      const lz = letzte ? (letzte.saetze[s] && (letzte.saetze[s].kg !== "" ) ? letzte.saetze[s]
                          : letzte.saetze.filter(x => x && x.kg !== "").slice(-1)[0]) : null;
      const vg = a.kg ?? (lz ? lz.kg ?? "" : "");
      const vw = a.wdh ?? (lz ? lz.wdh ?? "" : "");
      h += `<div class="set">
        <div class="set-lbl">${s+1}.</div>
        <div class="fld"><input type="number" inputmode="decimal" step="0.5" placeholder="–" value="${vg}"
          oninput="setSatz('${u.id}',${s},'kg',this.value)"><span>kg</span></div>
        <div class="fld"><input type="number" inputmode="numeric" placeholder="–" value="${vw}"

          <svg viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 7"/></svg></button>
      </div>`;
    }
    h += `</div>`;
    if(letzte) h += `<div class="last">Letztes Mal (${letzte.datum}): ${letzte.saetze.map(s => s.kg ? `${s.kg} kg × ${s.wdh||"?"}` : "–").join("  ·  ")}</div>`;
    h += `<div class="note" style="margin:14px 0 0;background:transparent;padding:0;font-size:13px">↗ ${u.progression}</div>
      </div></div>`;
  });

  h += `<div class="btn-row" style="margin-top:18px">
    <button class="btn" onclick="einheitFertig()">Einheit abschließen</button>
  </div>
  <div class="btn-row"><button class="btn ghost" onclick="einheitWechseln()">Andere Einheit wählen</button>
  <button class="btn ghost" onclick="zeigeHistorie()">Verlauf</button></div>
  <div class="card flat" style="margin-top:18px">
    <div class="sec-title" style="margin-top:0">Aufwärmen</div>
    <ul style="margin:0;padding-left:18px;font-size:13.5px;color:var(--text-2)">
      ${DATEN.aufwaermen.map(a => `<li style="margin-bottom:5px">${a}</li>`).join("")}</ul>
    <div class="sec-title">Progression</div>
    <div class="muted" style="font-size:13.5px">${DATEN.progression}</div>
  </div>`;
  document.getElementById("v-training").innerHTML = h;
}

function toggleEx(id){ document.getElementById("ex-" + id).classList.toggle("open"); }
function ensureAktiv(){
  const plan = TR[S.wIdx % 3];
  if(!S.wAktiv || S.wAktiv.planId !== plan.id) S.wAktiv = { planId: plan.id, saetze: {} };
  return S.wAktiv;
}
function setSatz(uid, i, feld, wert){
  const a = ensureAktiv();
  a.saetze[uid] = a.saetze[uid] || [];
  a.saetze[uid][i] = a.saetze[uid][i] || {};
  a.saetze[uid][i][feld] = wert === "" ? undefined : parseFloat(wert);
  save();
}
function toggleSatz(uid, i){
  const a = ensureAktiv();
  a.saetze[uid] = a.saetze[uid] || [];
  a.saetze[uid][i] = a.saetze[uid][i] || {};
  a.saetze[uid][i].ok = !a.saetze[uid][i].ok;
  save();
  const el = document.querySelectorAll(`#ex-${uid} .set-done`)[i];
  el.classList.toggle("on", !!a.saetze[uid][i].ok);
}
function einheitFertig(){
  const plan = TR[S.wIdx % 3];
  const a = ensureAktiv();
  const datum = new Date().toLocaleDateString("de-DE", { day:"2-digit", month:"2-digit" });
  let erfasst = 0;
  plan.uebungen.forEach(u => {
    const s = a.saetze[u.id];
    if(s && s.some(x => x && (x.kg || x.wdh))){
      S.wLog[u.id] = { datum, saetze: s.map(x => ({ kg: x?.kg ?? "", wdh: x?.wdh ?? "" })) };
      erfasst++;
    }
  });
  S.historie.unshift({ datum, name: plan.name, uebungen: erfasst });
  S.historie = S.historie.slice(0, 40);
  S.wIdx = (S.wIdx + 1) % 3;
  S.wAktiv = null;
  save(); renderTraining(); updateHeader();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

  openSheet(`<h2 style="font-size:19px;margin-bottom:4px">Einheit wählen</h2>

    ${TR.map((t, i) => `<div class="opt"><div><div class="opt-l">${t.name}</div>
      <div class="tiny">${t.fokus}</div></div>
      <button class="btn ghost" style="width:auto;padding:9px 16px" onclick="waehleEinheit(${i})">${i === S.wIdx ? "aktuell" : "wählen"}</button></div>`).join("")}`);
}
function waehleEinheit(i){ S.wIdx = i; S.wAktiv = null; save(); closeSheet(); renderTraining(); updateHeader(); }
function zeigeHistorie(){
  const h = S.historie.length

          return `<div class="ing"><span>${Z[zi.k].name}</span><span class="q">${mg.txt}</span></div>`; }).join("")}
        <div class="sec-title">Zubereitung</div>
        <ol class="steps">${r.schritte.map(s => `<li>${s}</li>`).join("")}</ol>
      </div></div>`;
  });

  h += `<div class="btn-row" style="margin-top:18px">
      <button class="btn sec" onclick="neueWochePlanen()">Neue Woche würfeln</button></div>
    <div class="tiny" style="margin-top:10px;text-align:center">
      Portionen sind auf ${S.kcal} kcal hochgerechnet (Faktor ${t.faktor.toString().replace(".",",")}×).
      Einzelnes Gericht tauschen mit ↻.</div>`;
  document.getElementById("v-essen").innerHTML = h;
}
function waehleTag(i){ S.tagIdx = i; save(); renderEssen(); updateHeader(); }
function toggleMeal(i){ document.getElementById("meal-" + i).classList.toggle("open"); }

function rerollMahlzeit(i){
  const t = S.woche.tage[S.tagIdx];
  const alt = rez(t.ids[i]);
  const inWoche = new Set();
  S.woche.tage.forEach(tg => tg.ids.forEach(id => inWoche.add(id)));
  let pool = alt.typ === "fruehstueck" ? FRUEH_OHNE
           : alt.typ === "shake" ? SHAKE
           : (t.fisch && alt.fisch) ? HAUPT_FISCH : HAUPT_OHNE;
  let frei = pool.filter(r => !inWoche.has(r.id));
  if(!frei.length) frei = pool.filter(r => r.id !== alt.id);
  const neu = frei[Math.floor(Math.random() * frei.length)];
  t.ids[i] = neu.id;
  // Tagesfaktor neu berechnen, damit das Kalorienziel erhalten bleibt
  const basis = t.ids.reduce((s, id) => s + rez(id).makro.kcal, 0);
  t.faktor = Math.min(2.0, Math.max(0.7, Math.round(S.kcal / basis * 20) / 20));
  S.abgehakt = {};
  save(); renderEssen();
}
function neueWochePlanen(){
  neueWoche(Math.floor(Math.random() * 1000000));
  S.tagIdx = 0; save(); renderEssen(); updateHeader();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ============ Rendering: Einkaufsliste ============ */
function renderEinkauf(){
  checkWoche();
  const tage = S.einkaufTage;
  const summe = {};
  tage.forEach(d => { const t = S.woche.tage[d];
    t.ids.forEach(id => rez(id).zut.forEach(zi => {
      summe[zi.k] = (summe[zi.k] || 0) + zi.g * t.faktor; })); });

  let h = `<div class="sec-title" style="margin-top:8px">Welche Tage einkaufen?</div><div class="chips">`;
  TAGE_K.forEach((tk, i) => {
    h += `<button class="chip ${tage.includes(i) ? "on" : ""}" onclick="toggleTag(${i})">${tk}</button>`;
  });
  h += `<button class="chip" onclick="alleTage()">Alle</button>
        <button class="chip" onclick="keineTage()">Keine</button></div>`;

  if(!tage.length){
    h += `<div class="empty">Wähle mindestens einen Tag aus.</div>`;
    document.getElementById("v-einkauf").innerHTML = h;
    return;
  }

  const abteilungen = {};
  Object.entries(summe).forEach(([k, g]) => {
    const z = Z[k];
    (abteilungen[z.abt] = abteilungen[z.abt] || []).push([k, g]);
  });
  const reihenfolge = ["Obst & Gemüse","Kühlregal","Fleisch","Fisch & TK","Trockenwaren","Konserven & Saucen","Öle, Nüsse & Backen","Gewürze & Vorrat"];
  const sortiert = reihenfolge.filter(a => abteilungen[a]);

  let gesamt = 0, erledigt = 0;
  let body = "";
  sortiert.forEach(abt => {
    const items = abteilungen[abt].sort((a, b) => Z[a[0]].name.localeCompare(Z[b[0]].name, "de"));
    body += `<div class="sec-title">${abt}</div><div class="card">`;
    items.forEach(([k, g]) => {
      const z = Z[k];
      const an = S.abgehakt[k];
      gesamt++; if(an) erledigt++;
      let q;
      if(z.vorrat){
        q = `im Vorrat prüfen`;
      }else if(z.stueck && g / z.stueck >= 0.4){
        const st = Math.max(1, Math.ceil(g / z.stueck));
        const gebinde = /St\u00fcck/.test(z.packname) ? "" : ` · ${z.packname}`;
        q = `<span class="si-pack">${st} St\u00fcck</span>${gebinde} · ${Math.round(g)} g Bedarf`;
      }else{
        const gr = Math.round(g / 5) * 5;
        const packs = Math.max(1, Math.ceil(gr / z.pack));
        q = `<span class="si-pack">${packs} \u00d7 ${z.packname}</span> · ${gr} ${einheit(k)} Bedarf`;
      }
      body += `<div class="shop-item ${an ? "done" : ""}" onclick="toggleKauf('${k}')">
        <div class="cb ${an ? "on" : ""}"><svg viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 7"/></svg></div>
        <div style="flex:1;min-width:0"><div class="si-name">${z.name}</div><div class="si-q">${q}</div></div>
      </div>`;
    });
    body += `</div>`;
  });

  const gewaehlt = tage.map(i => TAGE_K[i]).join(", ");
  h += `<div class="card" style="margin-top:14px">
      <div class="row"><div><div style="font-weight:600;font-size:15px">${erledigt} von ${gesamt} erledigt</div>
      <div class="tiny">${tage.length} ${tage.length === 1 ? "Tag" : "Tage"}: ${gewaehlt}</div></div>
      <button class="btn ghost" style="width:auto;padding:9px 15px" onclick="resetKauf()">Zurücksetzen</button></div></div>`;
  h += body;
  h += `<div class="tiny" style="margin:16px 0 0;text-align:center">
    Packungsgrößen orientieren sich am REWE-Standardsortiment. Bei Mehrfachpackungen bleibt Rest für die Folgewoche.</div>`;
  document.getElementById("v-einkauf").innerHTML = h;
}
function toggleTag(i){
  const p = S.einkaufTage.indexOf(i);
  if(p >= 0) S.einkaufTage.splice(p, 1); else S.einkaufTage.push(i);
  S.einkaufTage.sort((a, b) => a - b);
  save(); renderEinkauf(); updateHeader();
}
function alleTage(){ S.einkaufTage = [0,1,2,3,4,5,6]; save(); renderEinkauf(); updateHeader(); }
function keineTage(){ S.einkaufTage = []; save(); renderEinkauf(); updateHeader(); }
function toggleKauf(k){ S.abgehakt[k] = !S.abgehakt[k]; save(); renderEinkauf(); }
function resetKauf(){ S.abgehakt = {}; save(); renderEinkauf(); }

/* ============ Einstellungen ============ */
function openSettings(){
  const pz = proteinZiel();
  openSheet(`<h2 style="font-size:19px;margin-bottom:16px">Einstellungen</h2>
    <div class="opt"><div><div class="opt-l">Mahlzeiten pro Tag</div>
      <div class="tiny">3 Mahlzeiten = kleinere Portionen, inkl. Shake-Tagen</div></div>
      <div class="seg">
        <button class="${S.mahlzeiten === 2 ? "on" : ""}" onclick="setMahlzeiten(2)">2</button>
        <button class="${S.mahlzeiten === 3 ? "on" : ""}" onclick="setMahlzeiten(3)">3</button>
      </div></div>
    <div class="opt"><div><div class="opt-l">Kalorienziel</div>
      <div class="tiny">Verbrauch ${DATEN.koerper.verbrauch_kcal} kcal · Aufbau ab ca. +300</div></div>
      <div class="stepper"><button onclick="setKcal(-100)">−</button>
        <span class="val" id="valKcal">${S.kcal} kcal</span>
        <button onclick="setKcal(100)">+</button></div></div>
    <div class="opt"><div><div class="opt-l">Protein</div>
      <div class="tiny" id="valProt">${pz} g pro Tag bei ${KG} kg</div></div>
      <div class="stepper"><button onclick="setProt(-0.1)">−</button>
        <span class="val" id="valPk">${S.proteinProKg.toFixed(1).replace(".",",")} g/kg</span>
        <button onclick="setProt(0.1)">+</button></div></div>
    <div class="sec-title">Körperdaten</div>
    <div class="card flat"><div class="muted" style="font-size:13.5px">
      ${DATEN.koerper.groesse_cm} cm · ${KG} kg · Ø ${DATEN.koerper.verbrauch_kcal} kcal Verbrauch pro Tag</div></div>
    <div class="sec-title">Equipment</div>
    <div class="card flat"><ul style="margin:0;padding-left:18px;font-size:13.5px;color:var(--text-2)">
      ${DATEN.equipment.map(e => `<li style="margin-bottom:4px">${e}</li>`).join("")}</ul></div>
    <div class="sec-title">Daten</div>
    <button class="btn ghost" onclick="alleZuruecksetzen()">Alles zurücksetzen</button>
    <div class="tiny" style="margin-top:14px;text-align:center">${R.length} Rezepte · ${Object.keys(Z).length} Zutaten · v${DATEN.version}</div>`);
}
function setMahlzeiten(n){ S.mahlzeiten = n; neueWoche(S.wocheSeed); openSettings(); renderEssen(); renderEinkauf(); updateHeader(); }
function setKcal(d){
  S.kcal = Math.min(4000, Math.max(1500, S.kcal + d));
  document.getElementById("valKcal").textContent = S.kcal + " kcal";
  neueWoche(S.wocheSeed); renderEssen(); renderEinkauf(); updateHeader();
}
function setProt(d){
  S.proteinProKg = Math.min(2.5, Math.max(1.0, Math.round((S.proteinProKg + d) * 10) / 10));
  document.getElementById("valPk").textContent = S.proteinProKg.toFixed(1).replace(".", ",") + " g/kg";
  document.getElementById("valProt").textContent = proteinZiel() + " g pro Tag bei " + KG + " kg";
  save(); renderEssen();
}
function alleZuruecksetzen(){
  if(!confirm("Trainingsverlauf, Gewichte und Wochenplan wirklich löschen?")) return;
  try{ localStorage.removeItem("aufbau_v1"); }catch(e){}
  S = JSON.parse(JSON.stringify(DEF));
  neueWoche(); closeSheet(); renderAlles();
}

/* ============ Sheet / Tabs / Init ============ */
function openSheet(html){
  document.getElementById("sheetIn").innerHTML = `<div class="grip"></div>` + html;
  document.getElementById("sheet").classList.add("open");
}
function closeSheet(){ document.getElementById("sheet").classList.remove("open"); }

function showTab(name){
  S.tab = name; save();
  ["training","essen","einkauf"].forEach(t => {
    document.getElementById("v-" + t).classList.toggle("active", t === name);
    document.getElementById("t-" + t).classList.toggle("active", t === name);
  });
  if(name === "essen") renderEssen();
  if(name === "einkauf") renderEinkauf();
  updateHeader();
  window.scrollTo({ top: 0 });
}
function updateHeader(){
  const t = document.getElementById("hTitle"), s = document.getElementById("hSub");
  if(S.tab === "training"){
    t.textContent = "Training";
    s.textContent = `${TR[S.wIdx % 3].name} · Muskelaufbau, Fokus Oberkörper`;
  }else if(S.tab === "essen"){
    t.textContent = "Ernährung";
    s.textContent = `${TAGE[S.tagIdx]} · ${S.mahlzeiten} Mahlzeiten · ${S.kcal} kcal`;
  }else{
    t.textContent = "Einkaufsliste";
    s.textContent = S.einkaufTage.length === 7 ? "Ganze Woche"
      : S.einkaufTage.length ? S.einkaufTage.map(i => TAGE_K[i]).join(", ") : "Keine Tage gewählt";
  }
}
function renderAlles(){ renderTraining(); renderEssen(); renderEinkauf(); updateHeader(); }

window.addEventListener("scroll", () => {
  document.getElementById("hdr").classList.toggle("scrolled", window.scrollY > 4);
}, { passive: true });

checkWoche();
showTab(S.tab || "training");
renderAlles();
</script>
